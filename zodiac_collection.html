<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASTRO — Choose Your Sign</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --gold: #e8d5a8;
        --gold-bright: #f5e5bc;
        --gold-dim: #b8a074;
        --deep-navy: #050818;
        --nebula-pink: rgba(220, 130, 200, 0.35);
        --nebula-purple: rgba(140, 90, 200, 0.25);
        --nebula-blue: rgba(60, 100, 200, 0.3);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--deep-navy);
        color: var(--gold);
        font-family: "Cormorant Garamond", serif;
        cursor: default;
        user-select: none;
      }
      /* 🎥 spline 배경 */
      .spline-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        opacity: 0.55;
      }

      .spline-bg spline-viewer {
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .bg-overlay {
        position: fixed;
        inset: 0;
        z-index: 2;
        background: radial-gradient(circle at center, rgba(10, 15, 40, 0.08), rgba(5, 8, 24, 0.28));

        pointer-events: none;
      }
      /* ============= COSMIC BACKGROUND ============= */
      .cosmos {
        position: fixed;
        inset: 0;
        overflow: hidden;
        z-index: 1;
        pointer-events: none;
      }

      .cosmos-layer {
        position: absolute;
        inset: -10%;
        transition: transform 1.6s cubic-bezier(0.65, 0, 0.35, 1);
      }

      .deep-space {
        background:
          radial-gradient(ellipse at 20% 30%, rgba(14, 23, 64, 0.45) 0%, transparent 40%),
          radial-gradient(ellipse at 80% 70%, rgba(26, 13, 53, 0.42) 0%, transparent 50%),
          radial-gradient(ellipse at 50% 50%, rgba(10, 18, 48, 0.25) 0%, rgba(5, 8, 24, 0.35) 80%);
      }

      /* Stars - 3 layers for parallax twinkle */
      .stars {
        position: absolute;
        inset: -10%;
        background-image:
          radial-gradient(1px 1px at 23% 17%, white, transparent), radial-gradient(1px 1px at 67% 38%, rgba(255, 255, 255, 0.8), transparent),
          radial-gradient(1px 1px at 89% 73%, white, transparent), radial-gradient(2px 2px at 12% 81%, rgba(255, 255, 255, 0.9), transparent),
          radial-gradient(1px 1px at 45% 92%, white, transparent), radial-gradient(1px 1px at 78% 11%, rgba(200, 220, 255, 0.9), transparent),
          radial-gradient(1.5px 1.5px at 33% 64%, white, transparent), radial-gradient(1px 1px at 91% 28%, rgba(255, 240, 200, 0.8), transparent),
          radial-gradient(1px 1px at 5% 47%, white, transparent), radial-gradient(2px 2px at 58% 6%, rgba(255, 255, 255, 0.95), transparent),
          radial-gradient(1px 1px at 71% 83%, white, transparent), radial-gradient(1px 1px at 17% 36%, rgba(220, 230, 255, 0.7), transparent),
          radial-gradient(1.5px 1.5px at 95% 56%, white, transparent), radial-gradient(1px 1px at 41% 24%, rgba(255, 255, 255, 0.85), transparent),
          radial-gradient(1px 1px at 8% 67%, white, transparent), radial-gradient(2px 2px at 64% 51%, rgba(255, 250, 230, 0.9), transparent);
        background-size: 100% 100%;
        animation: twinkle 4s ease-in-out infinite alternate;
      }

      .stars-2 {
        background-image:
          radial-gradient(1px 1px at 14% 7%, rgba(255, 255, 255, 0.7), transparent), radial-gradient(1px 1px at 27% 94%, white, transparent),
          radial-gradient(1.5px 1.5px at 52% 33%, rgba(200, 210, 255, 0.8), transparent), radial-gradient(1px 1px at 76% 19%, white, transparent),
          radial-gradient(1px 1px at 38% 78%, rgba(255, 240, 210, 0.7), transparent), radial-gradient(1px 1px at 86% 44%, white, transparent),
          radial-gradient(2px 2px at 4% 25%, rgba(255, 255, 255, 0.85), transparent), radial-gradient(1px 1px at 60% 87%, white, transparent),
          radial-gradient(1px 1px at 19% 53%, rgba(220, 230, 255, 0.6), transparent), radial-gradient(1.5px 1.5px at 73% 62%, white, transparent),
          radial-gradient(1px 1px at 48% 14%, rgba(255, 250, 220, 0.75), transparent), radial-gradient(1px 1px at 92% 88%, white, transparent);
        animation: twinkle 6s ease-in-out infinite alternate-reverse;
      }

      .stars-3 {
        background-image:
          radial-gradient(0.5px 0.5px at 9% 12%, rgba(255, 255, 255, 0.5), transparent),
          radial-gradient(0.5px 0.5px at 35% 41%, rgba(255, 255, 255, 0.5), transparent),
          radial-gradient(0.5px 0.5px at 62% 22%, rgba(255, 255, 255, 0.5), transparent),
          radial-gradient(0.5px 0.5px at 81% 67%, rgba(255, 255, 255, 0.5), transparent),
          radial-gradient(0.5px 0.5px at 24% 79%, rgba(255, 255, 255, 0.5), transparent),
          radial-gradient(0.5px 0.5px at 55% 56%, rgba(255, 255, 255, 0.5), transparent),
          radial-gradient(0.5px 0.5px at 88% 31%, rgba(255, 255, 255, 0.5), transparent),
          radial-gradient(0.5px 0.5px at 11% 88%, rgba(255, 255, 255, 0.5), transparent),
          radial-gradient(0.5px 0.5px at 70% 9%, rgba(255, 255, 255, 0.5), transparent),
          radial-gradient(0.5px 0.5px at 43% 71%, rgba(255, 255, 255, 0.5), transparent);
        animation: twinkle 8s ease-in-out infinite alternate;
      }

      @keyframes twinkle {
        0% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 0.7;
        }
      }

      /* Nebula clouds */
      .nebula {
        position: absolute;
        width: 60vw;
        height: 60vw;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.7;
        transition:
          transform 1.6s cubic-bezier(0.65, 0, 0.35, 1),
          opacity 1.6s ease;
        pointer-events: none;
      }
      .nebula-1 {
        background: radial-gradient(circle, var(--nebula-pink) 0%, transparent 70%);
        top: 10%;
        right: -15%;
      }
      .nebula-2 {
        background: radial-gradient(circle, var(--nebula-purple) 0%, transparent 70%);
        bottom: -10%;
        left: -20%;
        width: 50vw;
        height: 50vw;
      }
      .nebula-3 {
        background: radial-gradient(circle, var(--nebula-blue) 0%, transparent 70%);
        top: -10%;
        left: 30%;
        width: 40vw;
        height: 40vw;
        opacity: 0.5;
      }

      .moon {
        position: absolute;
        width: 280px;
        height: 280px;
        border-radius: 50%;
        overflow: hidden;
        top: 5%;
        left: 8%;
        z-index: 3;

        background: transparent;

        box-shadow:
          0 0 60px rgba(255, 230, 180, 0.35),
          0 0 120px rgba(180, 200, 255, 0.2),
          inset 0 0 20px rgba(255, 255, 255, 0.15);
      }

      .moon-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scale(1.4);
        transition: transform 0.8s ease;
      }
      .moon::after {
        content: "";
        position: absolute;
        inset: -30%;
        border-radius: 50%;

        background: radial-gradient(circle, rgba(255, 240, 200, 0.25) 0%, rgba(180, 200, 255, 0.15) 40%, transparent 70%);

        filter: blur(40px);
        pointer-events: none;
      }
      /* Shooting star occasional */
      .shooting-star {
        position: absolute;
        width: 2px;
        height: 2px;
        background: white;
        border-radius: 50%;
        top: 30%;
        left: -10%;
        box-shadow: 0 0 6px white;
        animation: shoot 12s linear infinite;
        opacity: 0;
      }
      .shooting-star::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 80px;
        height: 1px;
        background: linear-gradient(90deg, white, transparent);
        transform: translateX(-80px);
      }
      @keyframes shoot {
        0% {
          transform: translate(0, 0);
          opacity: 0;
        }
        3% {
          opacity: 1;
        }
        8% {
          transform: translate(120vw, 30vh);
          opacity: 0;
        }
        100% {
          transform: translate(120vw, 30vh);
          opacity: 0;
        }
      }

      /* ============= NAVIGATION ============= */
      nav {
        position: fixed;
        top: 32px;
        left: 60px;
        z-index: 50;
        pointer-events: auto;
      }

      .menu-wrap {
        position: relative;
        pointer-events: auto;
      }

      .hamburger-btn {
        width: 46px;
        height: 46px;
        border: 1px solid rgba(232, 213, 168, 0.45);
        border-radius: 50%;
        background: rgba(5, 8, 24, 0.35);
        backdrop-filter: blur(10px);
        cursor: pointer;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;

        box-shadow:
          0 0 18px rgba(232, 213, 168, 0.16),
          inset 0 0 12px rgba(232, 213, 168, 0.08);
      }

      .hamburger-btn span {
        width: 18px;
        height: 1px;
        background: var(--gold-bright);
        box-shadow: 0 0 8px rgba(232, 213, 168, 0.6);
        transition:
          transform 0.3s ease,
          opacity 0.3s ease;
      }

      .hamburger-btn.open span:nth-child(1) {
        transform: translateY(6px) rotate(45deg);
      }

      .hamburger-btn.open span:nth-child(2) {
        opacity: 0;
      }

      .hamburger-btn.open span:nth-child(3) {
        transform: translateY(-6px) rotate(-45deg);
      }

      .main-menu-link {
        position: absolute;
        top: 52px;
        left: 0;

        padding: 12px 20px;
        border-radius: 999px;
        border: 1px solid rgba(232, 213, 168, 0.45);
        background: rgba(5, 8, 24, 0.48);
        backdrop-filter: blur(12px);

        font-family: "Cinzel", serif;
        font-size: 12px;
        letter-spacing: 3px;
        color: var(--gold-bright);
        text-decoration: none;
        white-space: nowrap;

        opacity: 0;
        transform: translateY(-8px);
        pointer-events: none;
        transition:
          opacity 0.28s ease,
          transform 0.28s ease;
      }

      .main-menu-link.show {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }
      /* Constellation art in upper portion */
      .constellation-stage {
        position: absolute;
        left: 50%;
        top: 65%;
        transform: translateX(-50%);
        width: min(680px, 64%);
        height: auto;
        aspect-ratio: 680 / 360;
        z-index: 3;
        pointer-events: none;
      }
      .constellation-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;

        transform: translate(var(--constellation-x, 0%), var(--constellation-y, 0%)) scale(var(--constellation-scale, 1));

        transition: opacity 0.8s ease;
        filter: drop-shadow(0 0 8px rgba(232, 213, 168, 0.4));
      }

      .constellation-svg.active {
        opacity: 1;
        animation: constellationFloat 8s ease-in-out infinite;
      }

      @keyframes constellationFloat {
        0%,
        100% {
          transform: translate(var(--constellation-x, 0%), var(--constellation-y, 0%)) scale(var(--constellation-scale, 1));
        }
        50% {
          transform: translate(var(--constellation-x, 0%), calc(var(--constellation-y, 0%) - 2%)) scale(var(--constellation-scale, 1));
        }
      }

      .constellation-svg .star-glow {
        fill: var(--gold-bright);
        filter: drop-shadow(0 0 4px var(--gold-bright));
      }
      .constellation-svg .star-major {
        fill: var(--gold-bright);
        filter: drop-shadow(0 0 8px var(--gold-bright));
      }
      .constellation-svg .star-line {
        stroke: var(--gold);
        stroke-width: 1;
        stroke-dasharray: 2 4;
        fill: none;
        opacity: 0.7;
      }
      .constellation-svg .twinkle-1 {
        animation: starTwinkle 2.4s ease-in-out infinite;
      }
      .constellation-svg .twinkle-2 {
        animation: starTwinkle 3.1s ease-in-out infinite 0.5s;
      }
      .constellation-svg .twinkle-3 {
        animation: starTwinkle 2.8s ease-in-out infinite 1s;
      }
      @keyframes starTwinkle {
        0%,
        100% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
      }

      /* ============= ZODIAC WHEEL ============= */
      .wheel-section {
        position: absolute;
        left: 50%;
        top: 48%;
        bottom: auto;
        transform: translateX(-50%);

        --wheel-size: var(--scene-size);
        --symbol-radius: 45%;
        --label-radius: 34%;

        width: var(--wheel-size);
        height: var(--wheel-size);
        aspect-ratio: 1 / 1;
        z-index: 4;
        pointer-events: auto;
      }

      .wheel {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        transition: transform 1.4s cubic-bezier(0.65, 0, 0.35, 1);
        transform: rotate(0deg);
      }

      /* Decorative circles */
      .wheel-rings {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .wheel-rings circle {
        fill: none;
        stroke: var(--gold);
        opacity: 0.4;
      }

      /* Center info display (doesn't rotate with wheel) */
      .wheel-center {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        pointer-events: none;
        z-index: 5;
      }
      .center-content {
        margin-top: -16%;
        text-align: center;
        max-width: 420px;
        padding: 0 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        pointer-events: auto;
        cursor: pointer;
      }
      .center-prompt {
        font-family: "Cinzel", serif;
        font-size: clamp(42px, 6.5vmin, 88px);
        font-weight: 600;
        letter-spacing: 10px;
        white-space: nowrap; /* 줄바꿈 금지 */
        display: inline-block;
        color: #a78f53; /* ✔ 어두운 골드 (너무 탁하지 않게) */

        text-shadow:
          0 0 6px rgba(90, 75, 35, 0.4),
          0 0 14px rgba(140, 110, 60, 0.3),
          0 0 28px rgba(90, 70, 40, 0.25);
      }
      .center-description {
        margin-top: 10px;
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-size: clamp(14px, 1.7vmin, 19px);
        line-height: 1.6;
        color: #ffeab7; /* ✔ 어두운 골드 (너무 탁하지 않게) */

        opacity: 0;
        transition: opacity 0.7s ease 0.4s;
        min-height: 60px;
      }
      .center-description.show {
        opacity: 1;
      }

      /* Each zodiac segment */
      .zodiac {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
        cursor: pointer;
        pointer-events: none;
      }

      .zodiac-symbol {
        position: absolute;
        transform: translate(-50%, -50%);
        width: calc(var(--wheel-size) * 0.04);
        height: calc(var(--wheel-size) * 0.04);
        color: var(--gold);
        transition:
          transform 1.4s cubic-bezier(0.65, 0, 0.35, 1),
          color 0.4s,
          filter 0.4s,
          width 0.4s,
          height 0.4s;
        pointer-events: auto;
        filter: drop-shadow(0 0 4px rgba(232, 213, 168, 0.4));
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .zodiac-symbol svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .zodiac-info {
        position: absolute;
        transform: translate(-50%, -50%);
        text-align: center;
        transition: transform 1.4s cubic-bezier(0.65, 0, 0.35, 1);
        pointer-events: auto;
        white-space: nowrap;
      }
      .zodiac-name {
        display: block;
        font-family: "Cinzel", serif;
        font-size: calc(var(--wheel-size) * 0.014);
        font-weight: 500;
        letter-spacing: calc(var(--wheel-size) * 0.003);
        color: var(--gold);
        transition: all 0.4s ease;
      }
      .zodiac-date {
        display: block;
        font-family: "Cormorant Garamond", serif;
        font-size: calc(var(--wheel-size) * 0.01);
        letter-spacing: calc(var(--wheel-size) * 0.002);
        color: var(--gold-dim);
        margin-top: calc(var(--wheel-size) * 0.002);
        transition: all 0.4s ease;
      }

      .zodiac:hover .zodiac-symbol {
        color: var(--gold-bright);
        filter: drop-shadow(0 0 12px var(--gold-bright));
      }
      .zodiac:hover .zodiac-name {
        color: var(--gold-bright);
      }

      .zodiac.active .zodiac-symbol {
        color: var(--gold-bright);
        width: calc(var(--wheel-size) * 0.065);
        height: calc(var(--wheel-size) * 0.065);
        filter: drop-shadow(0 0 18px var(--gold-bright)) drop-shadow(0 0 6px var(--gold-bright));
      }
      .zodiac.active .zodiac-name {
        color: var(--gold-bright);
        font-size: calc(var(--wheel-size) * 0.02);
        letter-spacing: calc(var(--wheel-size) * 0.0045);
        text-shadow: 0 0 10px rgba(232, 213, 168, 0.6);
      }

      .zodiac.active .zodiac-date {
        color: var(--gold);
        font-size: calc(var(--wheel-size) * 0.012);
      }

      /* Decorative flair lines on wheel */
      .wheel-flairs {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .wheel-flairs line {
        stroke: var(--gold);
        stroke-width: 0.2;
        opacity: 0.3;
      }

      /* Glowing dot indicator at top */
      .top-indicator {
        position: absolute;
        top: -20px;
        left: 50%;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--gold-bright);
        transform: translateX(-50%);
        box-shadow:
          0 0 16px var(--gold-bright),
          0 0 32px var(--gold-bright);
        z-index: 6;
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.7;
          transform: translateX(-50%) scale(1);
        }
        50% {
          opacity: 1;
          transform: translateX(-50%) scale(1.3);
        }
      }

      /* Viewport-anchored controls stay paired when the window height changes. */
      .prev-btn,
      .next-btn {
        position: fixed;
        top: auto;
        bottom: clamp(72px, 25vh, 300px);
        z-index: 8;

        padding: 12px 24px;
        border: 1px solid rgba(232, 213, 168, 0.65);
        border-radius: 999px;

        background: rgba(5, 8, 24, 0.45);
        color: var(--gold-bright);

        font-family: "Cinzel", serif;
        font-size: clamp(11px, 1.2vw, 14px);
        letter-spacing: 3px;

        cursor: pointer;
        backdrop-filter: blur(10px);
        box-shadow:
          0 0 16px rgba(232, 213, 168, 0.18),
          inset 0 0 14px rgba(232, 213, 168, 0.08);

        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease,
          color 0.25s ease;
      }

      .prev-btn {
        left: clamp(24px, 10vw, 192px);
      }

      .next-btn {
        right: clamp(24px, 10vw, 192px);
      }

      .next-btn:hover,
      .prev-btn:hover {
        transform: translateY(-2px);
        color: #fff3cf;
        box-shadow:
          0 0 26px rgba(232, 213, 168, 0.35),
          inset 0 0 18px rgba(232, 213, 168, 0.12);
      }

      .prev-btn:focus-visible,
      .next-btn:focus-visible,
      .hamburger-btn:focus-visible,
      .astro-note-close:focus-visible,
      .astro-save-drawing-btn:focus-visible,
      .astro-clear-drawing-btn:focus-visible,
      .astro-send-btn:focus-visible,
      .main-menu-link:focus-visible {
        outline: 2px solid var(--gold-bright);
        outline-offset: 4px;
      }
      /* Footer hint */
      .hint {
        position: fixed;
        bottom: 24px;
        right: 32px;
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-size: 13px;
        color: var(--gold-dim);
        opacity: 0.6;
        z-index: 10;
        letter-spacing: 1px;
      }
      .hint::before {
        content: "✦ ";
        color: var(--gold);
      }

      /* ============= ASTRO MEMO PANEL ============= */
      .astro-backdrop {
        position: fixed;
        inset: 0;
        z-index: 32;
        opacity: 0;
        pointer-events: none;
        background: rgba(0, 0, 0, 0.18);
        backdrop-filter: blur(0px);
        -webkit-backdrop-filter: blur(0px);
        transition:
          opacity 0.35s ease,
          backdrop-filter 0.35s ease;
      }

      .astro-backdrop.show {
        opacity: 1;
        pointer-events: auto;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      .astro-note-panel {
        position: fixed;
        top: 50%;
        right: clamp(1.2rem, 3vw, 3.2rem);
        width: min(41vw, 34rem);
        height: min(78vh, 45rem);
        transform: translate(115%, -50%) rotateY(-8deg);
        opacity: 0;
        pointer-events: none;
        z-index: 40;
        border-radius: 2rem;
        border: 1px solid rgba(232, 213, 168, 0.18);
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.045)), rgba(5, 8, 24, 0.68);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        box-shadow:
          0 0 2.5vw rgba(0, 0, 0, 0.42),
          0 0 2vw color-mix(in srgb, var(--active-color, var(--gold)) 24%, transparent),
          inset 0 0 1vw rgba(255, 255, 255, 0.08);
        overflow: hidden;
        transition:
          transform 0.7s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.45s ease;
      }

      .astro-note-panel.show {
        transform: translate(0, -50%) rotateY(0deg);
        opacity: 1;
        pointer-events: auto;
      }

      .astro-note-panel::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 0% 0%, color-mix(in srgb, var(--active-color, var(--gold)) 38%, transparent), transparent 42%);
        opacity: 0.78;
        pointer-events: none;

    scale(1.4)
    rotate(${moonRotation}deg)
  `;
        }
        const targetRotation = wheelRotation;
        wheel.style.transform = `rotate(${targetRotation}deg)`;

        segmentRefs.forEach(({ sym, info, angle }) => {
          const counter = -(targetRotation + angle);
          sym.style.transform = `translate(-50%, -50%) rotate(${counter}deg)`;
          info.style.transform = `translate(-50%, -50%) rotate(${counter}deg)`;
        });

        document.querySelectorAll(".zodiac").forEach((el, i) => {
          el.classList.toggle("active", i === idx);
        });

        document.querySelectorAll(".constellation-svg").forEach((el, i) => {
          el.classList.toggle("active", i === idx);
        });

        const z = zodiacs[idx];
        const scenes = generateScene(idx);
        moon.style.left = scenes.moon.x;
        moon.style.top = scenes.moon.y;
        moon.style.transform = `scale(${scenes.moon.scale})`;

        nebula1.style.transform = `translate(${scenes.n1.x}, ${scenes.n1.y}) scale(${scenes.n1.s})`;
        nebula2.style.transform = `translate(${scenes.n2.x}, ${scenes.n2.y}) scale(${scenes.n2.s})`;
        nebula3.style.transform = `translate(${scenes.n3.x}, ${scenes.n3.y}) scale(${scenes.n3.s})`;

        stars1.style.transform = `translate(${scenes.stars.x1}, ${scenes.stars.y1})`;
        stars2.style.transform = `translate(${scenes.stars.x2}, ${scenes.stars.y2})`;
        stars3.style.transform = `translate(${scenes.stars.x3}, ${scenes.stars.y3})`;

        centerDesc.textContent = z.desc;
        centerDesc.classList.add("show");
      }

      function generateScene(i) {
        const ang = (i * segmentAngle * Math.PI) / 180;
        return {
          moon: {
            x: `${5 + 75 * (0.5 + 0.5 * Math.cos(ang + 1.2))}%`,
            y: `${-8 + 14 * (0.5 + 0.5 * Math.sin(ang + 0.4))}%`,
            scale: 0.75 + 0.35 * Math.abs(Math.cos(ang)),
          },
          n1: {
            x: `${-20 + 30 * Math.cos(ang)}vw`,
            y: `${-10 + 25 * Math.sin(ang)}vh`,
            s: 1 + 0.3 * Math.sin(ang * 2),
          },
          n2: {
            x: `${20 * Math.cos(ang + 2)}vw`,
            y: `${15 * Math.sin(ang + 2)}vh`,
            s: 1 + 0.4 * Math.cos(ang * 2),
          },
          n3: {
            x: `${15 * Math.cos(ang + 4)}vw`,
            y: `${10 * Math.sin(ang + 4)}vh`,
            s: 1 + 0.2 * Math.sin(ang),
          },
          stars: {
            x1: `${5 * Math.cos(ang)}vw`,
            y1: `${3 * Math.sin(ang)}vh`,
            x2: `${-3 * Math.cos(ang)}vw`,
            y2: `${4 * Math.sin(ang + 1)}vh`,
            x3: `${4 * Math.cos(ang + 2)}vw`,
            y3: `${-3 * Math.sin(ang)}vh`,
          },
        };
      }

      setTimeout(() => {
        if (currentIdx === -1) selectZodiac(0);
      }, 800);

      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const hamburgerBtn = document.getElementById("hamburgerBtn");
      const mainMenuLink = document.getElementById("mainMenuLink");

      prevBtn.addEventListener("click", () => {
        playZodiacSound();
        const prevIdx = currentIdx === -1 ? zodiacs.length - 1 : (currentIdx - 1 + zodiacs.length) % zodiacs.length;

        selectZodiac(prevIdx);
      });

      nextBtn.addEventListener("click", () => {
        playZodiacSound();
        const nextIdx = currentIdx === -1 ? 0 : (currentIdx + 1) % zodiacs.length;

        selectZodiac(nextIdx);
      });

      hamburgerBtn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        const isOpen = hamburgerBtn.classList.toggle("open");
        mainMenuLink.classList.toggle("show", isOpen);
        hamburgerBtn.setAttribute("aria-expanded", String(isOpen));
        mainMenuLink.setAttribute("aria-hidden", String(!isOpen));
        mainMenuLink.tabIndex = isOpen ? 0 : -1;
      });

      // ====================== ASTRO MEMO PANEL ======================
      const astroColors = {
        CAPRICORN: "#E8D5A8",
        AQUARIUS: "#85D8FF",
        PISCES: "#BBA7FF",
        ARIES: "#FF8B74",
        TAURUS: "#9FE6A0",
        GEMINI: "#FFD777",
        CANCER: "#D6E8FF",
        LEO: "#FFB657",
        VIRGO: "#C9DFA5",
        LIBRA: "#F5C7FF",
        SCORPIO: "#D066FF",
        SAGITTARIUS: "#FFC06A",
      };

      const astroBackdrop = document.getElementById("astroBackdrop");
      const astroNotePanel = document.getElementById("astroNotePanel");
      const astroNoteClose = document.getElementById("astroNoteClose");
      const astroNoteTitle = document.getElementById("astroNoteTitle");
      const astroMetaSign = document.getElementById("astroMetaSign");
      const astroMetaDate = document.getElementById("astroMetaDate");
      const astroMemoBadge = document.getElementById("astroMemoBadge");
      const astroMemoList = document.getElementById("astroMemoList");
      const astroMemoForm = document.getElementById("astroMemoForm");
      const astroNameInput = document.getElementById("astroNameInput");
      const astroMemoInput = document.getElementById("astroMemoInput");
      const astroMemoCanvas = document.getElementById("astroMemoCanvas");
      const astroClearDrawingBtn = document.getElementById("astroClearDrawingBtn");
      const astroSaveDrawingBtn = document.getElementById("astroSaveDrawingBtn");
      const astroCtx = astroMemoCanvas.getContext("2d");

      let activeMemoSign = zodiacs[0];
      let isAstroDrawing = false;
      let lastFocusedElement = null;
      const MAX_ASTRO_MEMOS_PER_SIGN = 16;

      function loadAstroMemos() {
        try {
          const saved = JSON.parse(localStorage.getItem("astroZodiacMemos") || "{}");
          if (!saved || typeof saved !== "object" || Array.isArray(saved)) return {};

          Object.keys(saved).forEach((sign) => {
            if (!Array.isArray(saved[sign])) {
              delete saved[sign];
              return;
            }
            saved[sign] = saved[sign].slice(-MAX_ASTRO_MEMOS_PER_SIGN);
          });

          return saved;
        } catch {
          return {};
        }
      }

      function persistAstroMemos() {
        try {
          localStorage.setItem("astroZodiacMemos", JSON.stringify(astroMemos));
          return true;
        } catch {
          return false;
        }
      }

      const astroMemos = loadAstroMemos();

      function addAstroMemo(sign, memo) {
        const previousItems = astroMemos[sign] ? [...astroMemos[sign]] : null;
        const nextItems = [...(astroMemos[sign] || []), memo];
        astroMemos[sign] = nextItems.slice(-MAX_ASTRO_MEMOS_PER_SIGN);

        if (persistAstroMemos()) return true;

        if (previousItems) astroMemos[sign] = previousItems;
        else delete astroMemos[sign];
        return false;
      }

      function openAstroPanel(idx = currentIdx >= 0 ? currentIdx : 0) {
        activeMemoSign = zodiacs[idx] || zodiacs[0];
        const color = astroColors[activeMemoSign.name] || "#E8D5A8";
        lastFocusedElement = document.activeElement;

        document.documentElement.style.setProperty("--active-color", color);
        astroNoteTitle.textContent = activeMemoSign.name;
        astroMetaSign.textContent = activeMemoSign.name;
        astroMetaDate.textContent = activeMemoSign.dates;
        astroMemoBadge.textContent = `${activeMemoSign.name} FIELD`;

        astroBackdrop.classList.add("show");
        astroNotePanel.classList.add("show");
        astroNotePanel.setAttribute("aria-hidden", "false");
        astroNotePanel.inert = false;
        astroStickyWall.style.opacity = "1";

        requestAnimationFrame(() => {
          resizeAstroCanvas();
          renderAstroMemos();
          astroNoteClose.focus({ preventScroll: true });
        });
      }

      function closeAstroPanel() {
        if (!astroNotePanel.classList.contains("show")) return;

        astroBackdrop.classList.remove("show");
        astroNotePanel.classList.remove("show");
        astroNotePanel.setAttribute("aria-hidden", "true");
        astroNotePanel.inert = true;

        astroStickyWall.innerHTML = "";
        astroStickyWall.style.opacity = "0";
        lastFocusedElement?.focus({ preventScroll: true });
      }

      function resizeAstroCanvas() {
        const rect = astroMemoCanvas.getBoundingClientRect();
        const ratio = window.devicePixelRatio || 1;
        const previous = astroMemoCanvas.toDataURL();

        astroMemoCanvas.width = Math.max(1, Math.floor(rect.width * ratio));
        astroMemoCanvas.height = Math.max(1, Math.floor(rect.height * ratio));
        astroCtx.setTransform(ratio, 0, 0, ratio, 0, 0);
        astroCtx.lineCap = "round";
        astroCtx.lineJoin = "round";
        astroCtx.lineWidth = 3;

        if (previous && previous.length > 100) {
          const img = new Image();
          img.onload = () => astroCtx.drawImage(img, 0, 0, rect.width, rect.height);
          img.src = previous;
        }
      }

      function getAstroCanvasPos(e) {
        const rect = astroMemoCanvas.getBoundingClientRect();
        const touch = e.touches && e.touches[0] ? e.touches[0] : e;
        return {
          x: touch.clientX - rect.left,
          y: touch.clientY - rect.top,
        };
      }

      function startAstroDrawing(e) {
        e.preventDefault();
        isAstroDrawing = true;
        const pos = getAstroCanvasPos(e);
        astroCtx.beginPath();
        astroCtx.moveTo(pos.x, pos.y);
      }

      function drawAstroMemo(e) {
        if (!isAstroDrawing) return;
        e.preventDefault();
        const pos = getAstroCanvasPos(e);
        const color = getComputedStyle(document.documentElement).getPropertyValue("--active-color").trim() || "#E8D5A8";

        astroCtx.strokeStyle = color;
        astroCtx.shadowColor = color;
        astroCtx.shadowBlur = 12;
        astroCtx.lineTo(pos.x, pos.y);
        astroCtx.stroke();
      }

      function stopAstroDrawing() {
        isAstroDrawing = false;
        astroCtx.closePath();
      }

      function clearAstroDrawing() {
        astroCtx.clearRect(0, 0, astroMemoCanvas.width, astroMemoCanvas.height);
      }

      function saveAstroDrawing() {
        const sign = activeMemoSign.name;
        const saved = addAstroMemo(sign, {
          name: "DRAWING",
          type: "drawing",
          text: astroMemoCanvas.toDataURL("image/png"),
        });

        if (!saved) {
          alert("저장 공간이 가득 찼어요. 기존 메모를 삭제한 뒤 다시 시도해 주세요.");
          return;
        }

        clearAstroDrawing();
        renderAstroMemos();
      }

      function renderAstroMemos() {
        const sign = activeMemoSign.name;
        const items = astroMemos[sign] || [];

        astroMemoList.innerHTML = "";
        astroStickyWall.innerHTML = "";

        if (!items.length) {
          astroMemoList.innerHTML = `
      <div class="astro-memo">
        <div class="astro-memo-name">SYSTEM</div>
        <div class="astro-memo-text">아직 남긴 메모가 없어. 별자리 위에 첫 마음을 남겨봐.</div>
      </div>
    `;
          return;
        }

        items.forEach((item, index) => {
          const memo = document.createElement("div");
          memo.className = "astro-memo";

          memo.innerHTML = `
      <div class="astro-memo-name">${escapeAstroHTML(item.name || "익명")}</div>
      <div class="astro-memo-text">
        ${item.type === "drawing" ? `<img class="astro-memo-img" src="${item.text}" alt="drawing memo">` : escapeAstroHTML(item.text || "")}
      </div>
    `;

          memo.addEventListener("dblclick", () => {
            astroMemos[sign].splice(index, 1);
            persistAstroMemos();
            renderAstroMemos();
          });

          astroMemoList.appendChild(memo);

          const sticky = document.createElement("div");
          sticky.className = "astro-sticky-note";

          sticky.innerHTML = `
  <button class="astro-sticky-note-delete" type="button">×</button>
  <div class="astro-sticky-name">${escapeAstroHTML(item.name || "익명")}</div>
  ${
    item.type === "drawing"
      ? `<img class="astro-sticky-drawing-img" src="${item.text}" alt="drawing memo">`
      : `<div class="astro-sticky-text">${escapeAstroHTML(item.text || "")}</div>`
  }
`;

          sticky.querySelector(".astro-sticky-note-delete").addEventListener("click", (e) => {
            e.stopPropagation();

            astroMemos[sign].splice(index, 1);
            persistAstroMemos();
            renderAstroMemos();
          });

          astroStickyWall.appendChild(sticky);
        });
      }

      function escapeAstroHTML(str) {
        return String(str).replace(
          /[&<>'"]/g,
          (tag) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              "'": "&#39;",
              '"': "&quot;",
            })[tag],
        );
      }

      astroMemoForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const sign = activeMemoSign.name;
        const name = astroNameInput.value.trim() || "익명의 별친구";
        const text = astroMemoInput.value.trim();
        if (!text) return;

        const saved = addAstroMemo(sign, { name, type: "text", text });
        if (!saved) {
          alert("저장 공간이 가득 찼어요. 기존 메모를 삭제한 뒤 다시 시도해 주세요.");
          return;
        }

        astroNameInput.value = "";
        astroMemoInput.value = "";
        renderAstroMemos();
      });

      astroMemoCanvas.addEventListener("mousedown", startAstroDrawing);
      astroMemoCanvas.addEventListener("mousemove", drawAstroMemo);
      window.addEventListener("mouseup", stopAstroDrawing);
      astroMemoCanvas.addEventListener("touchstart", startAstroDrawing, {
        passive: false,
      });
      astroMemoCanvas.addEventListener("touchmove", drawAstroMemo, {
        passive: false,
      });
      window.addEventListener("touchend", stopAstroDrawing);

      astroClearDrawingBtn.addEventListener("click", clearAstroDrawing);
      astroSaveDrawingBtn.addEventListener("click", saveAstroDrawing);
      astroNoteClose.addEventListener("click", closeAstroPanel);
      astroBackdrop.addEventListener("click", closeAstroPanel);
      window.addEventListener("resize", resizeAstroCanvas);
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeAstroPanel();
      });

      centerPrompt.addEventListener("click", () => openAstroPanel(currentIdx >= 0 ? currentIdx : 0));
      centerDesc.addEventListener("click", () => openAstroPanel(currentIdx >= 0 ? currentIdx : 0));
    </script>
  </body>
</html>
