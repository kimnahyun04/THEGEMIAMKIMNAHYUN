<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Birthstone Collection</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #212230;
        font-family: "Cormorant Garamond", "Noto Sans KR", serif;
        color: rgba(255, 255, 255, 0.9);
      }

      @media (any-hover: hover) and (any-pointer: fine) {
        html {
          font-size: 0.833333vw;
        }
      }

      body::before {
        content: "";
        position: fixed;
        inset: -20%;
        background:
          radial-gradient(
            circle at 16% 22%,
            rgba(160, 35, 60, 0.26),
            transparent 28%
          ),
          radial-gradient(
            circle at 80% 18%,
            rgba(90, 180, 150, 0.18),
            transparent 26%
          ),
          radial-gradient(
            circle at 52% 78%,
            rgba(255, 190, 100, 0.12),
            transparent 30%
          ),
          linear-gradient(135deg, #050507, #10070b 42%, #050507);
        filter: blur(0.1vw);
        z-index: -3;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background:
          linear-gradient(
            120deg,
            transparent 0%,
            rgba(255, 255, 255, 0.07) 22%,
            transparent 36%
          ),
          radial-gradient(
            circle at 50% 50%,
            transparent 0%,
            rgba(0, 0, 0, 0.48) 78%
          );
        mix-blend-mode: screen;
        opacity: 0.42;
        z-index: -2;
        pointer-events: none;
      }

      .viewport {
        position: fixed;
        inset: 0;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .game-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      .spline-stage {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
      }

      .bg-spline {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0.82;
        pointer-events: none;
        transform: scale(1.02);
        transform-origin: center center;
        filter: brightness(0.92) saturate(1.08);
      }

      .grain {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        opacity: 0.13;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      .page {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        padding: clamp(1.2rem, 2vw, 2.2rem);
        z-index: 5;
      }

      .top-bar {
        position: absolute;
        left: clamp(1.2rem, 2.4vw, 2.4rem);
        right: clamp(1.2rem, 2.4vw, 2.4rem);
        top: clamp(0.2rem, 0.55vw, 0.55rem);
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: space-between;
        pointer-events: none;
      }

      .brand {
        pointer-events: auto;
        transform: translateY(18px);
      }

      .brand-kicker {
        font-size: clamp(0.62rem, 0.75vw, 0.78rem);
        letter-spacing: 0.34em;
        color: rgba(255, 205, 210, 0.52);
        margin-bottom: 0.4rem;
      }

      .brand-title {
        margin: 0;
        font-size: clamp(1.6rem, 3vw, 3.6rem);
        line-height: 0.92;
        letter-spacing: -0.045em;
        font-weight: 600;
        color: rgba(255, 250, 246, 0.96);
        text-shadow: 0 0 1vw rgba(255, 120, 135, 0.15);
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        pointer-events: auto;
      }

      .pill-btn {
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.78);
        border-radius: 999px;
        padding: 0.62rem 1rem;
        font-family: inherit;
        font-size: clamp(0.72rem, 0.82vw, 0.9rem);
        letter-spacing: 0.14em;
        cursor: pointer;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: all 0.28s ease;
      }

      .pill-btn:hover {
        color: white;
        transform: translateY(-10px);
        border-color: rgba(255, 210, 210, 0.28);
        box-shadow: 0 0 1vw rgba(255, 120, 140, 0.14);
      }

      .top-actions .pill-btn {
        transform: translateY(-8px);
      }
      .collection-stage {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 1200px;
      }

      .orbit-system {
        position: relative;
        width: min(72vw, 48rem);
        height: min(72vw, 48rem);
        min-width: 34rem;
        min-height: 34rem;
        border-radius: 50%;
        transform-style: preserve-3d;
      }

      .orbit-system::before,
      .orbit-system::after {
        content: "";
        position: absolute;
        inset: 10%;
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 50%;
        transform: rotateX(62deg) rotateZ(-12deg);
        box-shadow: 0 0 2vw rgba(255, 180, 180, 0.08);
      }

      .orbit-system::after {
        inset: 20%;
        transform: rotateX(68deg) rotateZ(24deg);
        opacity: 0.65;
      }

      .center-card {
        position: absolute;
        left: 50%;
        top: 50%;
        width: clamp(13rem, 20vw, 20rem);
        min-height: clamp(13rem, 20vw, 20rem);
        transform: translate(-50%, -50%);
        border-radius: 2rem;
        padding: 1.6rem;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        overflow: hidden;
        background:
          linear-gradient(
            145deg,
            rgba(255, 255, 255, 0.18),
            rgba(255, 255, 255, 0.04)
          ),
          radial-gradient(
            circle at 28% 18%,
            rgba(255, 180, 190, 0.34),
            transparent 48%
          );
        border: 1px solid rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
        box-shadow:
          0 0 2vw rgba(0, 0, 0, 0.32),
          0 0 3vw rgba(255, 120, 140, 0.08),
          inset 0 0 1vw rgba(255, 255, 255, 0.08);
        z-index: 4;
      }

      .center-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          120deg,
          transparent 0%,
          rgba(255, 255, 255, 0.18) 35%,
          transparent 54%
        );
        transform: translateX(-60%);
        opacity: 0.75;
      }

      .center-number {
        font-size: clamp(3.2rem, 7vw, 6.5rem);
        line-height: 0.8;
        font-weight: 700;
        letter-spacing: -0.08em;
        color: rgba(255, 255, 255, 0.92);
        mix-blend-mode: screen;
      }

      .center-copy {
        margin-top: 1rem;
        font-family: "Noto Sans KR", sans-serif;
        font-size: clamp(0.78rem, 0.9vw, 0.95rem);
        line-height: 1.7;
        color: rgba(255, 255, 255, 0.7);
      }

      .birthstone {
        --angle: 0deg;
        --distance: min(27vw, 17.5rem);
        --stone: #fff;
        --stone-light: color-mix(in srgb, var(--stone) 50%, white);
        --stone-deep: color-mix(in srgb, var(--stone) 80%, black);
        --delay: 0s;
        position: absolute;
        left: 50%;
        top: 50%;
        width: clamp(4.6rem, 7vw, 6.7rem);
        height: clamp(4.6rem, 7vw, 6.7rem);
        transform: translate(-50%, -50%) rotate(var(--angle))
          translate(var(--distance)) rotate(calc(var(--angle) * -1));
        border: none;
        padding: 0;
        background: transparent;
        cursor: pointer;
        z-index: 5;
        transition: filter 0.5s ease;
        animation: stoneFloat 7s ease-in-out infinite;
        animation-delay: var(--delay);
      }

      /* ── 외곽 컬러 헤일로 (호흡하는 빛) ────────────── */
      .birthstone::before {
        content: "";
        position: absolute;
        inset: -45%;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          color-mix(in srgb, var(--stone) 50%, transparent) 0%,
          color-mix(in srgb, var(--stone) 22%, transparent) 30%,
          color-mix(in srgb, var(--stone) 8%, transparent) 55%,
          transparent 75%
        );
        filter: blur(14px);
        pointer-events: none;
        z-index: -2;
        animation: gemHalo 5s ease-in-out infinite;
      }

      /* ── 회전하는 프리즘 림 ──────────────────────── */
      .birthstone::after {
        content: "";
        position: absolute;
        inset: -8%;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          transparent 0deg,
          color-mix(in srgb, var(--stone-light) 70%, white) 25deg,
          rgba(255, 255, 255, 0.4) 55deg,
          transparent 95deg,
          transparent 175deg,
          color-mix(in srgb, var(--stone) 60%, white 40%) 215deg,
          rgba(255, 255, 255, 0.3) 250deg,
          transparent 295deg
        );
        filter: blur(6px);
        opacity: 0.65;
        pointer-events: none;
        z-index: -1;
        mix-blend-mode: screen;
        animation: gemShimmer 11s linear infinite;
      }

      @keyframes gemHalo {
        0%,
        100% {
          opacity: 0.7;
          transform: scale(0.95);
        }
        50% {
          opacity: 1;
          transform: scale(1.08);
        }
      }

      @keyframes gemShimmer {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes stoneFloat {
        0%,
        100% {
          transform: translate(-50%, -50%) rotate(var(--angle))
            translate(var(--distance)) rotate(calc(var(--angle) * -1))
            translateY(0);
        }
        50% {
          transform: translate(-50%, -50%) rotate(var(--angle))
            translate(var(--distance)) rotate(calc(var(--angle) * -1))
            translateY(-8px);
        }
      }

      .birthstone:hover {
        filter: brightness(1.2)
          drop-shadow(0 0 2vw color-mix(in srgb, var(--stone) 70%, transparent));
        z-index: 10;
      }

      /* ── 보석 본체 (3D 컬러 코어) ──────────────────── */
      .stone-core {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 50%;

        background-image:
          /* 보조 글린트 (오른쪽 아래 작은 점광) */
          radial-gradient(
            circle at 78% 78%,
            rgba(255, 255, 255, 0.55) 0%,
            rgba(255, 255, 255, 0.15) 8%,
            transparent 18%
          ),
          /* 1. 상단 림 라이트 (얇은 백색 헤일로) */
            radial-gradient(
              ellipse 80% 20% at 50% 8%,
              rgba(255, 255, 255, 0.7) 0%,
              rgba(255, 255, 255, 0.18) 35%,
              transparent 65%
            ),
          /* 2. 메인 광택 (왼쪽 위 큰 빛) */
            radial-gradient(
              ellipse 50% 38% at 32% 28%,
              rgba(255, 255, 255, 0.85) 0%,
              rgba(255, 255, 255, 0.35) 20%,
              transparent 55%
            ),
          /* 3. 컬러 코어 — 입체 그라디언트 */
            radial-gradient(
              circle at 45% 65%,
              var(--stone-light) 0%,
              var(--stone) 35%,
              var(--stone-deep) 100%
            );

        box-shadow:
          0 0 18px color-mix(in srgb, var(--stone) 35%, transparent),
          0 0 38px color-mix(in srgb, var(--stone) 18%, transparent),
          /* 외곽 컬러 글로우 (멀리) */ 0 0 36px
            color-mix(in srgb, var(--stone) 50%, transparent),
          0 0 14px color-mix(in srgb, var(--stone) 70%, transparent),
          /* 그림자 (떠있는 느낌) */ 0 10px 26px rgba(0, 0, 0, 0.45),
          /* 상단 글래스 빛 */ inset 0 6px 14px rgba(255, 255, 255, 0.6),
          /* 하단 subsurface scattering (보석 내부에서 빛 새어나옴) */ inset
            0 -8px 18px color-mix(in srgb, var(--stone) 85%, transparent),
          /* 인너 림 (얇은 백색 테두리) */ inset 0 0 0 1.5px
            rgba(255, 255, 255, 0.4),
          /* 깊이감 */ inset 0 0 28px
            color-mix(in srgb, var(--stone) 30%, transparent);

        transition:
          box-shadow 0.5s ease,
          border-color 0.5s ease;

        /* 미세하게 회전하는 광택 효과를 위한 base */
        overflow: hidden;
        filter: blur(1.5px);
      }

      /* ── 메인 하이라이트 (큰 부드러운 광채) ─────────── */
      .stone-core::before {
        content: "";
        position: absolute;
        top: 8%;
        left: 14%;
        width: 50%;
        height: 34%;
        border-radius: 50%;
        background: radial-gradient(
          ellipse at 35% 40%,
          rgba(255, 255, 255, 0.82) 0%,
          rgba(255, 255, 255, 0.45) 20%,
          rgba(255, 255, 255, 0.18) 45%,
          rgba(255, 255, 255, 0.05) 70%,
          transparent 90%
        );
        pointer-events: none;
        transform: rotate(-18deg);
        animation: glintBreathe 4s ease-in-out infinite;
        filter: blur(80px);
      }

      @keyframes glintBreathe {
        0%,
        100% {
          opacity: 0.85;
          transform: rotate(-18deg) scale(0.98);
        }
        50% {
          opacity: 1;
          transform: rotate(-18deg) scale(1.04);
        }
      }

      /* ── 핀포인트 스파클 (자연스럽게 번지는 점광) ───── */
      .stone-core::after {
        content: "";
        position: absolute;
        top: 13%;
        left: 23%;
        width: 22%;
        height: 17%;
        border-radius: 50%;
        background: radial-gradient(
          ellipse at 45% 45%,
          rgba(255, 255, 255, 0.7) 0%,
          rgba(255, 255, 255, 0.45) 15%,
          rgba(255, 255, 255, 0.22) 35%,
          rgba(255, 255, 255, 0.1) 55%,
          rgba(255, 255, 255, 0.03) 75%,
          transparent 95%
        );
        filter: blur(4px);
        transform: rotate(-12deg);
        pointer-events: none;
        animation: sparkleTwinkle 3.5s ease-in-out infinite;
      }

      @keyframes sparkleTwinkle {
        0%,
        100% {
          opacity: 0.7;
          transform: rotate(-12deg) scale(0.97);
        }
        50% {
          opacity: 0.88;
          transform: rotate(-12deg) scale(1.03);
        }
      }

      /* ── 호버 — 모든 빛이 강해짐 ───────────────────── */
      .birthstone:hover .stone-core {
        border-color: rgba(255, 255, 255, 0.8);
        box-shadow:
          0 0 50px color-mix(in srgb, var(--stone) 75%, transparent),
          0 0 20px color-mix(in srgb, var(--stone) 90%, transparent),
          0 12px 30px rgba(0, 0, 0, 0.5),
          inset 0 7px 16px rgba(255, 255, 255, 0.75),
          inset 0 -9px 20px color-mix(in srgb, var(--stone) 95%, transparent),
          inset 0 0 0 1.5px rgba(255, 255, 255, 0.6),
          inset 0 0 32px color-mix(in srgb, var(--stone) 45%, transparent);
      }

      .birthstone:hover::before {
        opacity: 1;
        inset: -55%;
      }

      /* ── 월 라벨 ─────────────────────────────────── */
      .stone-month {
        position: absolute;
        bottom: -1.8rem;
        left: 50%;
        transform: translateX(-50%);
        white-space: nowrap;
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-size: clamp(0.62rem, 0.74vw, 0.78rem);
        letter-spacing: 0.26em;
        color: rgba(255, 255, 255, 0.55);
        text-shadow: 0 0 0.6vw rgba(255, 255, 255, 0.2);
        transition:
          color 0.4s ease,
          text-shadow 0.4s ease,
          letter-spacing 0.4s ease,
          bottom 0.4s ease;
      }

      .birthstone:hover .stone-month {
        color: color-mix(in srgb, var(--stone) 35%, white 65%);
        text-shadow:
          0 0 1vw color-mix(in srgb, var(--stone) 90%, transparent),
          0 0 0.4vw rgba(255, 255, 255, 0.4);
        letter-spacing: 0.32em;
        bottom: -2rem;
      }

      .note-panel {
        position: absolute;
        top: 50%;
        right: clamp(1.2rem, 3vw, 3.2rem);
        width: min(41vw, 34rem);
        height: min(78vh, 45rem);
        transform: translate(110%, -50%) rotateY(-8deg);
        opacity: 0;
        pointer-events: none;
        z-index: 40;
        border-radius: 2rem;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background:
          linear-gradient(
            145deg,
            rgba(255, 255, 255, 0.16),
            rgba(255, 255, 255, 0.05)
          ),
          rgba(8, 7, 10, 0.52);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        box-shadow:
          0 0 2.5vw rgba(0, 0, 0, 0.38),
          inset 0 0 1vw rgba(255, 255, 255, 0.08);
        overflow: hidden;
        transition:
          transform 0.7s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.45s ease;
      }

      .note-panel.show {
        transform: translate(0, -50%) rotateY(0deg);
        opacity: 1;
        pointer-events: auto;
      }

      .note-panel::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 0% 0%,
          color-mix(in srgb, var(--active-color, #ff8c8c) 36%, transparent),
          transparent 42%
        );
        opacity: 0.72;
        pointer-events: none;
      }

      .note-inner {
        position: relative;
        height: 100%;
        padding: clamp(1.2rem, 2.2vw, 2rem);
        display: grid;
        grid-template-rows: auto auto auto 1fr auto;
        gap: 1rem;
      }

      .note-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem;
      }

      .note-kicker {
        font-family: "Cinzel", serif;
        font-size: clamp(0.62rem, 0.74vw, 0.78rem);
        letter-spacing: 0.28em;
        color: rgba(255, 255, 255, 0.48);
        margin-bottom: 0.4rem;
      }

      .note-title {
        margin: 0;
        font-family: "Cinzel", serif;
        font-size: clamp(2rem, 4vw, 4.2rem);
        line-height: 0.9;
        letter-spacing: -0.035em;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.96);
      }

      .note-close {
        width: 2.35rem;
        height: 2.35rem;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.78);
        cursor: pointer;
        font-size: 1.15rem;
        transition: all 0.25s ease;
      }

      .note-close:hover {
        background: rgba(255, 255, 255, 0.12);
        color: white;
      }

      .refraction-card {
        min-height: 10rem;
        border-radius: 1.2rem;
        padding: 1rem;
        background:
          linear-gradient(
            120deg,
            color-mix(in srgb, var(--active-color) 25%, white),
            rgba(255, 255, 255, 0.05) 40%
          ),
          radial-gradient(
            circle at 20% 20%,
            color-mix(in srgb, var(--active-color) 45%, transparent),
            transparent 60%
          ),
          radial-gradient(
            circle at 80% 70%,
            color-mix(in srgb, var(--active-color) 30%, transparent),
            transparent 70%
          );
        border: none;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
        position: relative;
        overflow: hidden;
        cursor: crosshair;
      }

      .refraction-card::before {
        content: "";
        position: absolute;
        left: -10%;
        bottom: 10%;
        width: 130%;
        height: 40%;
        background: linear-gradient(
          100deg,
          transparent 0%,
          rgba(255, 255, 255, 0.88) 10%,
          var(--active-color, #ff8c8c) 30%,
          rgba(90, 190, 255, 0.56) 48%,
          rgba(255, 245, 140, 0.58) 64%,
          transparent 84%
        );
        opacity: 0.86;
        transform: rotate(-15deg);
        mix-blend-mode: screen;
        filter: blur(6px);
      }

      .refraction-card::after {
        content: "MEMO FIELD";
        position: absolute;
        right: 1rem;
        top: 0.9rem;
        font-size: 0.62rem;
        letter-spacing: 0.22em;
        color: rgba(255, 255, 255, 0.42);
        font-family: "Cinzel", serif;
      }

      #memoCanvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
      }

      .draw-hint {
        position: absolute;
        left: 1rem;
        bottom: 0.8rem;
        z-index: 3;
        font-size: 0.62rem;
        letter-spacing: 0.22em;
        color: rgba(255, 255, 255, 0.42);
        font-family: "Cinzel", serif;
        pointer-events: none;
      }

      .clear-drawing-btn {
        position: absolute;
        right: 1rem;
        bottom: 0.75rem;
        z-index: 4;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.72);
        border-radius: 999px;
        padding: 0.35rem 0.7rem;
        font-family: "Cinzel", serif;
        font-size: 0.6rem;

      @keyframes stickyIn {
        from {

        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }

      .collection-loading {

        background: #67538b;

        opacity: 1;
        visibility: visible;
        transition:
          opacity 1.1s ease,
          visibility 1.1s ease;
      }

      .collection-loading.hide {
        opacity: 0;
        visibility: hidden;
      }

      .loading-stone-orbit {
        position: relative;
        width: 8.4rem;
        height: 8.4rem;
        animation: loadingStoneSpin 5.6s linear infinite;
      }

      .loading-stone-orbit span {
        position: absolute;
        left: 50%;
        top: 50%;

        width: 0.82rem;
        height: 0.82rem;
        border-radius: 50%;

        background:
          radial-gradient(
            circle at 30% 25%,
            rgba(255, 255, 255, 0.452),
            transparent 26%
          ),
          radial-gradient(
            circle,
            var(--c),
            color-mix(in srgb, var(--c) 60%, black 40%)
          );

        box-shadow:
          0 0 0.7rem color-mix(in srgb, var(--c) 65%, transparent),
          inset 0 0 0.35rem rgba(255, 255, 255, 0.22);

        transform: translate(-50%, -50%) rotate(calc(var(--i) * 30deg))
          translateX(3.65rem);
      }

      .loading-stone-orbit::before {
        content: "";
        position: absolute;
        inset: 1.1rem;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      .loading-stone-orbit::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1rem;
        height: 1rem;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        background: rgba(255, 245, 245, 0.92);
        box-shadow:
          0 0 1rem rgba(255, 255, 255, 0.65),
          0 0 2rem rgba(255, 150, 170, 0.28);
      }

      @keyframes loadingStoneSpin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      .loading-copy {
        text-align: center;
      }

      .loading-kicker {
        margin-bottom: 0.45rem;
        font-size: 0.68rem;
        letter-spacing: 0.32em;
        color: rgba(255, 210, 220, 0.58);
      }

      .loading-text {
        font-size: clamp(0.9rem, 1.1vw, 1.08rem);
        letter-spacing: 0.08em;
        color: rgba(255, 255, 255, 0.82);
      }
      .sparkle-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 2;
      }

      .sparkle {
        position: absolute;
        border-radius: 50%;
        background: white;
        pointer-events: none;

        box-shadow:
          0 0 8px white,
          0 0 16px rgba(255, 255, 255, 0.6),
          0 0 30px rgba(255, 255, 255, 0.4);

        animation: sparkleAnim linear infinite;
      }

      @keyframes sparkleAnim {
        0% {
          opacity: 0;
          transform: scale(0.3) translateY(0);
        }
        20% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: scale(1.4) translateY(-60px);
        }
      }

      .memo-drawing-img {
        width: 100%;
        height: 5.2rem;
        object-fit: contain;
        display: block;
        border-radius: 0.6rem;
        background: rgba(255, 255, 255, 0.06);
      }

      .sticky-drawing-img {
        width: 100%;
        height: 5.4rem;
        object-fit: contain;
        display: block;
        border-radius: 0.45rem;
        background: rgba(255, 255, 255, 0.18);
      }

      @media (prefers-reduced-motion: reduce) {
        .birthstone,
        .birthstone::before,
        .birthstone::after,
        .stone-core::before,
        .stone-core::after,
        .loading-stone-orbit,
        .sparkle,
        .sticky-note,
        .memo {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <script
      type="module"
      src="https://unpkg.com/@splinetool/viewer@1.12.90/build/spline-viewer.js"
    ></script>

    <div class="viewport">

    <div class="sparkle-layer"></div>

    <div class="grain"></div>
    <main class="page">
      <header class="top-bar">

              같은 월생끼리 짧은 메모를 남기고 서로의 기운을 확인해보세요.

          <div class="note-meta">

            <div class="meta-box">
              <div class="meta-label">STONE</div>
              <div class="meta-value" id="metaStone">Garnet</div>
            </div>
            <div class="meta-box">
              <div class="meta-label">ROOM</div>
              <div class="meta-value" id="metaRoom">1월생 메모</div>

          <section class="memo-area">

          </section>

          <form class="memo-form" id="memoForm">
            <input
              id="nameInput"
              type="text"
              placeholder="이름 / 닉네임"
              autocomplete="off"
            />
            <input
              id="memoInput"
              type="text"
              placeholder="이 월의 탄생석에게 메모 남기기"
              autocomplete="off"
            />

    <script>
      let soundUnlocked = false;

      const gemHoverSound = new Audio("./ting2.mp3");
      gemHoverSound.volume = 0.8;
      gemHoverSound.preload = "auto";

      document.addEventListener(
        "click",
        () => {
          soundUnlocked = true;
          gemHoverSound
            .play()
            .then(() => {
              gemHoverSound.pause();
              gemHoverSound.currentTime = 0;
            })
            .catch(() => {});
        },
        { once: true },
      );

      const stones = [
        {
          month: "01",
          name: "Garnet",
          ko: "가넷",
          color: "#ffa0a0",
          note: "1월생의 붉은 시작을 남겨주세요.",
        },
        {
          month: "02",
          name: "Amethyst",
          ko: "자수정",
          color: "#9b83d4",
          note: "고요한 보랏빛에게 마음을 남겨주세요.",
        },
        {
          month: "03",
          name: "Aquamarine",
          ko: "아쿠아마린",
          color: "#73acd8",
          note: "맑은 물빛처럼 편지를 남겨주세요.",
        },
        {
          month: "04",
          name: "Diamond",
          ko: "다이아몬드",
          color: "#dbeef2",
          note: "빛나는 투명함 안에 메모를 남겨주세요.",
        },
        {
          month: "05",
          name: "Emerald",
          ko: "에메랄드",
          color: "#66d6b3",
          note: "초록의 회복에게 문장을 남겨주세요.",
        },
        {
          month: "06",
          name: "Pearl",
          ko: "진주",
          color: "#e8dcc3",
          note: "부드러운 진주빛에 오늘을 남겨주세요.",
        },
        {
          month: "07",
          name: "Ruby",
          ko: "루비",
          color: "#d98b97",
          note: "강한 붉은 심장에게 말을 남겨주세요.",
        },
        {
          month: "08",
          name: "Peridot",
          ko: "페리도트",
          color: "#badb90",
          note: "싱그러운 빛에 작은 행운을 남겨주세요.",
        },
        {
          month: "09",
          name: "Sapphire",
          ko: "사파이어",
          color: "#838ad1",
          note: "깊은 푸른빛에게 진심을 남겨주세요.",
        },
        {
          month: "10",
          name: "Opal",
          ko: "오팔",
          color: "#d9b4cb",
          note: "무지갯빛 감정의 조각을 남겨주세요.",
        },
        {
          month: "11",
          name: "Topaz",
          ko: "토파즈",
          color: "#ddc292",
          note: "따뜻한 금빛에게 응원을 남겨주세요.",
        },
        {
          month: "12",
          name: "Turquoise",
          ko: "터키석",
          color: "#69bfd1",
          note: "푸른 보호의 빛에 메모를 남겨주세요.",
        },
      ];

      const orbitSystem = document.getElementById("orbitSystem");
      const mainMenuBtn = document.getElementById("mainMenuBtn");
      const notePanel = document.getElementById("notePanel");
      const backdrop = document.getElementById("backdrop");
      const noteClose = document.getElementById("noteClose");
      const noteKicker = document.getElementById("noteKicker");
      const noteTitle = document.getElementById("noteTitle");
      const metaMonth = document.getElementById("metaMonth");
      const metaStone = document.getElementById("metaStone");
      const metaRoom = document.getElementById("metaRoom");
      const sameMonthBadge = document.getElementById("sameMonthBadge");
      const memoList = document.getElementById("memoList");
      const memoForm = document.getElementById("memoForm");
      const nameInput = document.getElementById("nameInput");
      const memoInput = document.getElementById("memoInput");
      const stickyWall = document.getElementById("stickyWall");
      const loadingOverlay = document.getElementById("loadingOverlay");
      const sparkleLayer = document.querySelector(".sparkle-layer");
      let activeStone = stones[0];
      let memos = loadMemos();

      function loadMemos() {
        try {
          const saved = JSON.parse(
            localStorage.getItem("birthstoneMemos") || "{}",
          );
          return saved && typeof saved === "object" && !Array.isArray(saved)
            ? saved
            : {};
        } catch (error) {
          console.warn("저장된 탄생석 메모를 불러올 수 없습니다.", error);
          return {};
        }
      }

      function saveMemos() {
        try {
          localStorage.setItem("birthstoneMemos", JSON.stringify(memos));
          return true;
        } catch (error) {
          console.error("탄생석 메모를 저장할 수 없습니다.", error);
          return false;
        }
      }

      stones.forEach((stone, index) => {
        const angle = index * 30 - 90;
        const btn = document.createElement("button");
        btn.className = "birthstone";
        btn.type = "button";
        btn.setAttribute(
          "aria-label",
          `${Number(stone.month)}월 탄생석 ${stone.ko} 메모 열기`,
        );
        btn.style.setProperty("--angle", `${angle}deg`);
        btn.style.setProperty("--stone", stone.color);
        btn.style.setProperty("--delay", `${index * -0.6}s`);
        btn.innerHTML = `
        <div class="stone-core"></div>
        <div class="stone-month">${stone.month} · ${stone.name}</div>
      `;
        btn.addEventListener("click", () => openStone(stone));
        btn.addEventListener("mouseenter", () => {
          if (!soundUnlocked) return;
          gemHoverSound.currentTime = 0;
          gemHoverSound.play().catch(() => {});
        });
        orbitSystem.appendChild(btn);
      });

      function openStone(stone) {
        activeStone = stone;
        document.documentElement.style.setProperty(
          "--active-color",
          stone.color,
        );

        noteKicker.textContent = `${stone.month} MONTH BIRTHSTONE`;
        noteTitle.textContent = stone.name;
        metaMonth.textContent = stone.month;
        metaStone.textContent = `${stone.name} / ${stone.ko}`;
        metaRoom.textContent = `${Number(stone.month)}월생 메모`;
        sameMonthBadge.textContent = stone.note;

        renderMemos();
        backdrop.classList.add("show");
        notePanel.classList.add("show");
        stickyWall.style.opacity = "1";
        stickyWall.style.pointerEvents = "none";
        requestAnimationFrame(resizeMemoCanvas);
      }

      function closePanel() {
        backdrop.classList.remove("show");
        notePanel.classList.remove("show");

        stickyWall.innerHTML = "";
        stickyWall.style.opacity = "0";
        stickyWall.style.pointerEvents = "none";
      }

      function renderMemos() {
        const month = activeStone.month;
        const saved = memos[month] || [];

        memoList.innerHTML = "";
        stickyWall.innerHTML = "";

        if (!saved.length) {
          memoList.innerHTML = `
    <div class="memo empty-memo">
      <div class="memo-name">MEMO FIELD</div>
      <div class="memo-text">메모를 남겨주세요</div>
    </div>
  `;
          return;
        }

        saved.forEach((item, i) => {
          const memo = document.createElement("div");
          memo.className = "memo";
          memo.innerHTML = `
  <div class="memo-name">${escapeHTML(item.name)}</div>
  ${
    item.type === "drawing"
      ? `<img class="memo-drawing-img" src="${item.text}" alt="drawing memo">`
      : `<div class="memo-text">${escapeHTML(item.text)}</div>`
  }
`;
          memoList.prepend(memo);

          const sticky = document.createElement("div");
          sticky.className = "sticky-note";

          sticky.style.left = `${(i % 2) * 15}rem`;
          sticky.style.top = `${Math.floor(i / 2) * 9.7}rem`;

          sticky.innerHTML = `
  <button class="sticky-note-delete" type="button">×</button>
  <div class="sticky-note-name">${escapeHTML(item.name)}</div>
  ${
    item.type === "drawing"
      ? `<img class="sticky-drawing-img" src="${item.text}" alt="drawing memo">`
      : `<div class="sticky-note-text">${escapeHTML(item.text)}</div>`
  }
`;

          sticky
            .querySelector(".sticky-note-delete")
            .addEventListener("click", (e) => {
              e.stopPropagation();

              const [removedMemo] = memos[month].splice(i, 1);
              if (!saveMemos()) {
                memos[month].splice(i, 0, removedMemo);
                window.alert(
                  "메모를 삭제할 수 없습니다. 잠시 후 다시 시도해주세요.",
                );
                return;
              }
              renderMemos();
            });

          stickyWall.appendChild(sticky);
        });
      }

      memoForm.addEventListener("submit", (e) => {
        e.preventDefault();

        const name = nameInput.value.trim() || "익명의 월생";
        const text = memoInput.value.trim();
        if (!text) return;

        const month = activeStone.month;
        if (!memos[month]) memos[month] = [];
        memos[month].push({ name, text });
        if (!saveMemos()) {
          memos[month].pop();
          window.alert(
            "메모 저장 공간이 부족합니다. 기존 메모를 정리해주세요.",
          );
          return;
        }

        nameInput.value = "";
        memoInput.value = "";
        renderMemos();
      });

      function goMain() {
        window.location.href = "The_gem_I_am.html";
      }

      function escapeHTML(str) {
        return String(str).replace(
          /[&<>'"]/g,
          (tag) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              "'": "&#39;",
              '"': "&quot;",
            })[tag],
        );
      }

      noteClose.addEventListener("click", closePanel);
      backdrop.addEventListener("click", closePanel);
      mainMenuBtn.addEventListener("click", goMain);

      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closePanel();
      });

      window.addEventListener("load", () => {
        setTimeout(() => {
          loadingOverlay.classList.add("hide");

          loadingOverlay.addEventListener(
            "transitionend",
            () => {
              loadingOverlay.remove();
            },
            { once: true },
          );
        }, 3200);
      });
      function createSparkle() {
        const s = document.createElement("div");
        s.className = "sparkle";

        const size = Math.random() * 2.5 + 1;
        s.style.width = size + "px";
        s.style.height = size + "px";

        s.style.left = Math.random() * 100 + "vw";
        s.style.top = Math.random() * 100 + "vh";

        s.style.animationDuration = Math.random() * 2 + 2 + "s";

        sparkleLayer.appendChild(s);

        setTimeout(() => {
          s.remove();
        }, 4000);
      }

      // 화면에 과도하게 쌓이지 않도록 생성된 별은 4초 뒤 제거합니다.
      setInterval(createSparkle, 80);
      const memoCanvas = document.getElementById("memoCanvas");
      const clearDrawingBtn = document.getElementById("clearDrawingBtn");
      const saveDrawingBtn = document.getElementById("saveDrawingBtn");
      const ctx = memoCanvas.getContext("2d");

      let isDrawing = false;
      let hasDrawing = false;

      function resizeMemoCanvas() {
        const rect = memoCanvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;

        memoCanvas.width = rect.width * dpr;
        memoCanvas.height = rect.height * dpr;

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.lineWidth = 3;
        hasDrawing = false;
      }

      function getCanvasPos(e) {
        const rect = memoCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        return {
          x: clientX - rect.left,
          y: clientY - rect.top,
        };
      }

      function startDrawing(e) {
        e.preventDefault();
        isDrawing = true;
        const pos = getCanvasPos(e);

        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
      }

      function draw(e) {
        if (!isDrawing) return;

        e.preventDefault();

        const pos = getCanvasPos(e);

        ctx.strokeStyle =
          getComputedStyle(document.documentElement).getPropertyValue(
            "--active-color",
          ) || "#ffffff";

        ctx.shadowColor = ctx.strokeStyle;
        ctx.shadowBlur = 10;

        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        hasDrawing = true;
      }

      function stopDrawing() {
        isDrawing = false;
      }

      memoCanvas.addEventListener("mousedown", startDrawing);
      memoCanvas.addEventListener("mousemove", draw);
      memoCanvas.addEventListener("mouseup", stopDrawing);
      memoCanvas.addEventListener("mouseleave", stopDrawing);

      memoCanvas.addEventListener("touchstart", startDrawing, {
        passive: false,
      });
      memoCanvas.addEventListener("touchmove", draw, { passive: false });
      memoCanvas.addEventListener("touchend", stopDrawing);
      memoCanvas.addEventListener("touchcancel", stopDrawing);

      clearDrawingBtn.addEventListener("click", () => {
        ctx.clearRect(0, 0, memoCanvas.width, memoCanvas.height);
        hasDrawing = false;
      });

      window.addEventListener("resize", resizeMemoCanvas);
      window.addEventListener("load", resizeMemoCanvas);
      saveDrawingBtn.addEventListener("click", () => {
        if (!hasDrawing) return;

        const month = activeStone.month;

        if (!memos[month]) memos[month] = [];

        const drawingData = memoCanvas.toDataURL("image/png");

        memos[month].push({
          name: "DRAWING MEMO",
          text: drawingData,
          type: "drawing",
        });

        if (!saveMemos()) {
          memos[month].pop();
          window.alert(
            "그림 메모 저장 공간이 부족합니다. 기존 메모를 정리해주세요.",
          );
          return;
        }

        ctx.clearRect(0, 0, memoCanvas.width, memoCanvas.height);
        hasDrawing = false;
        renderMemos();
      });
    </script>
  </body>
</html>
